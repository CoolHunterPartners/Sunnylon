type Mutation {
  login(login: LoginInput!): LoginResponse
}

input LoginInput {
  userName: String!
  password: String!
}

type LoginResponse {
  accessToken: String
  expirationDate: String
  refreshToken: String
}

type Query {
  refreshToken(oldRefreshToken: String!): LoginResponse
  profile: Profile
}

type Profile {
  userId: String
  email: String
  firstName: String
  lastName: String
  phone: String
  userName: String
}

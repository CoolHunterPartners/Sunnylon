type Mutation {
  login(login: LoginInput!): LoginResponse
  registerClient(model: CreateClientViewModelInput!): String
}

input LoginInput {
  userName: String!
  password: String!
}

type LoginResponse {
  accessToken: String
  expirationDate: String
  refreshToken: String
}

type Query {
  refreshToken(oldRefreshToken: String!): LoginResponse
  profile: Profile
  clients(skip: Int, take: Int, order: [GetClientDtoSortInput!], where: GetClientDtoFilterInput): ClientListResponse
  genders: [KeyValue]
  currencies: [KeyValue]
  provinces: [KeyValue]
  identificationTypes: [KeyValue]
  relatedType: [KeyValue]
  relationShiptType: [KeyValue]
}

type Profile {
  userId: String
  email: String
  firstName: String
  lastName: String
  phone: String
  userName: String
}

type ClientListResponse {
  items: [ClientDto]
  totalCount: Int
}

type ClientDto {
  idClient: String
  name: String
  lastName: String
  fullName: String
  email: String
  identification: String
  phone: String
  birthDay: String
}

input GetClientDtoSortInput {
  field: String
  dir: String
}

input GetClientDtoFilterInput {
  search: String
}

input CreateClientViewModelInput {
  name: String
  lastName: String
  genderId: String
  identificationTypeId: String
  identification: String
  birthDay: String
  phone: String
  email: String
  addresses: [AddressInput]
  jobs: [JobInput]
  related: [RelatedInput]
}

input AddressInput {
  id: String
}

input JobInput {
  id: String
}

input RelatedInput {
  id: String
}

type KeyValue {
  key: String
  value: String
}
